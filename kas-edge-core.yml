header:
  version: 8
  includes:
  - ./base.yml
  - ./mender-full.yml
  - ./no-dhcpcd.yml
  - ./unipi-eol.yml

machine: unipi-e415
distro: poky
target:
  - mender-image-full-cmdline-rofs

repos:
  meta-unipi:
    path: meta-unipi


bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"

  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"

  debug-tweaks: |
    # mkpasswd -m sha256crypt <your-password>
    # password: ppp
    IMAGE_CLASSES:append:pn-mender-image-full-cmdline-rofs = " extrausers"
    PASSWD = "\$5\$2qQtEpyiwk33Lj5/\$KK0mV7X4Mzt15EAo56iymdLUtL9Bbv0HWe8hpUZdhm1"
    EXTRA_USERS_PARAMS = "useradd -p '${PASSWD}' unipi; \
                          usermod -p '${PASSWD}' root;"

  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"

  license: |
    # Uncomment next line to allow the license
    # See: linux-firmware-rpidistro in docs/ipcompliance.md
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

  core: |
    SPLASH = ""
    VIRTUAL-RUNTIME_syslog = ""
    VIRTUAL-RUNTIME_base-utils-syslog = ""
    # choose one of this extras for real machine
    CORE_IMAGE_EXTRA_INSTALL:append = " packagegroup-machine-base"
    #CORE_IMAGE_EXTRA_INSTALL:append = " packagegroup-base-extended"
    # add tpm packages
    CORE_IMAGE_EXTRA_INSTALL:append = " os-release"
    #CORE_IMAGE_EXTRA_INSTALL:append = " squashfs-tools erofs-utils"

  root-ro: |
    DISTRO_FEATURES:append = " overlayfs"
    MACHINE_EXTRA_RRECOMMENDS:append = " overlayfs-all"
    EXTRA_IMAGE_FEATURES:append = " overlayfs-etc"

    ## non-volatile overlay over etc
    OVERLAYFS_ETC_MOUNT_POINT = "/data"
    OVERLAYFS_ETC_FSTYPE = "ext4"
    OVERLAYFS_ETC_DEVICE = "/dev/mmcblk0p4"
    OVERLAYFS_ETC_USE_ORIG_INIT_NAME = "0"
    OVERLAYFS_ETC_CREATE_MOUNT_DIRS = "0"
    U_BOOT_SCR_BOOTARGS = "ro init=/sbin/preinit cgroup_enable=memory"

    ## non-volatile overlays over /home /root /usr/share/containers/systemd
    OVERLAYFS_MOUNT_POINT[home] = "/data"
    OVERLAYFS_WRITABLE_PATHS[home] = "/home"
    OVERLAYFS_QA_SKIP[home] = "mount-configured"
    OVERLAYFS_MOUNT_POINT[root] = "/data"
    OVERLAYFS_WRITABLE_PATHS[root] = "/root"
    OVERLAYFS_QA_SKIP[root] = "mount-configured"
    # OVERLAYFS_MOUNT_POINT[containers] = "/data"
    # OVERLAYFS_WRITABLE_PATHS[containers] = "/usr/share/containers/systemd"
    # OVERLAYFS_QA_SKIP[containers] = "mount-configured"

  security: |
    DISTRO_FEATURES:append = " tpm2"
    DISTRO_FEATURES:append = " security"
    CORE_IMAGE_EXTRA_INSTALL:append = " packagegroup-security-tpm2"

  # fitimage1: |
    # KERNEL_CLASSES:append = " kernel-fitimage"
    # KERNEL_IMAGETYPES:append = " fitImage"
    # FIT_ADDRESS_CELLS = "2"

  e41x: |
    RPI_USE_U_BOOT = "1"
    # RPI_USE_RPIBOOT = "1"
    RPI_USE_SIGNEDBOOT = "1"
    # INITRAMFS_IMAGE = "initramfs-boot-image"

    # IMAGE_FSTYPES = "mender"
    IMAGE_FSTYPES = "sdimg"
    MENDER_STORAGE_TOTAL_SIZE_MB = "1280"
    ARTIFACTIMG_FSTYPE = "ext4"
    MENDER_DATA_PART_FSTYPE = "ext4"
    MENDER_BOOT_PART_SIZE_MB = "48"
    MENDER_BOOT_PART_MOUNT_LOCATION:unipi_edge = "/boot/firmware"
    MENDER_BOOT_PART_FSTAB_OPTS = "noatime,nodiratime,discard,noauto,x-systemd.automount,sync"

    MENDER_FEATURES_DISABLE:append = " mender-grub mender-image-uefi"
    MENDER_SERVER_URL = "https://eu.hosted.mender.io"
    XMENDER_AUTH_PRIVATE_KEY = "handle:0x81800001"
    XMENDER_UNIPI_IDENTITY = "1"
