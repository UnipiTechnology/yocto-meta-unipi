header:
  version: 8
  includes:
  - ./base.yml
  - ./mender-full.yml
  - ./no-dhcpcd.yml

machine: unipi-e414
distro: poky
target:
  - base-os

repos:
  meta-unipi:
    path: meta-unipi


bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"

  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"

  debug-tweaks: |
    IMAGE_FEATURES += "empty-root-password allow-empty-password allow-root-login"
    # mkpasswd -m sha256crypt <your-password>
    # password: ppp
    PASSWD = "\$5\$2qQtEpyiwk33Lj5/\$KK0mV7X4Mzt15EAo56iymdLUtL9Bbv0HWe8hpUZdhm1"
    EXTRA_USERS_PARAMS = "usermod -p '${PASSWD}' root;"

  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"

  license: |
    # Uncomment next line to allow the license
    # See: linux-firmware-rpidistro in docs/ipcompliance.md
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
    PREFERRED_PROVIDER_coreutils = "uutils-coreutils"
    RRECOMMENDS:kbd-keymaps:remove = "kbd-keymaps-pine"
    PACKAGECONFIG:remove = "readline"
    # PACKAGECONFIG:append = " libedit"


  base-os: |
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " systemd"
    DISTRO_FEATURES:remove = "initscripts"
    ## use journald instead of syslog
    VIRTUAL-RUNTIME_syslog = ""
    VIRTUAL-RUNTIME_base-utils-syslog = ""
    PACKAGECONFIG:remove:pn-systemd = "userdb"

  security: |
    DISTRO_FEATURES:append = " tpm2"
    DISTRO_FEATURES:append = " security"

  e41x: |
    RPI_USE_U_BOOT = "1"
    # RPI_USE_RPIBOOT = "1"
    RPI_USE_SIGNEDBOOT = "1"
    # INITRAMFS_IMAGE = "initramfs-boot-image"

    # IMAGE_FSTYPES = "mender"
    IMAGE_FSTYPES = "sdimg"

    MENDER_FEATURES_DISABLE:append = " mender-grub mender-image-uefi"
    MENDER_SERVER_URL = "https://eu.hosted.mender.io"
    MENDER_TENANT_TOKEN = "XXXXXXXXXXXXXXXXXXX"
    MENDER_CONNECT_SHELL = "/bin/sh"
    MENDER_CONNECT_USER = "root"
    IMAGE_INSTALL:append:pn-base-os = " mender-connect"

    #SOURCE_DATE_EPOCH = "1767567600" 
    #MENDER_FEATURES_ENABLE:append = " mender-uboot mender-image-sd"
    #MENDER_FEATURES_ENABLE:append = " mender-persist-systemd-machine-id"
