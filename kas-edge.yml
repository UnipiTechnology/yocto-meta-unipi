header:
  version: 8

machine: unipi-e414
distro: poky
target:
  - base-os

repos:
  meta-unipi:
    path: meta-unipi

  bitbake:
    url: https://git.openembedded.org/bitbake
    path: layers/bitbake
    #tag: yocto-5.0.14
    branch: '2.8'
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: layers/openembedded-core
    branch: scarthgap
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: layers/meta-yocto
    branch: scarthgap
    layers:
      meta-poky:
      #meta-yocto-bsp:

  meta-openembedded:
    url: http://git.openembedded.org/meta-openembedded
    path: layers/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      #meta-perl:

  meta-security:
    url: https://git.yoctoproject.org/meta-security
    path: layers/meta-security
    branch: scarthgap
    layers:
      .:
      meta-tpm:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    path: layers/meta-raspberrypi
    branch: scarthgap

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"

  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"

  debug-tweaks: |
    IMAGE_FEATURES += "empty-root-password allow-empty-password allow-root-login"
    # mkpasswd -m sha256crypt <your-password>
    # password: ppp
    PASSWD = "\$5\$2qQtEpyiwk33Lj5/\$KK0mV7X4Mzt15EAo56iymdLUtL9Bbv0HWe8hpUZdhm1"
    EXTRA_USERS_PARAMS = "usermod -p '${PASSWD}' root;"

  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"

  license: |
    # Uncomment next line to allow the license
    # See: linux-firmware-rpidistro in docs/ipcompliance.md
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

  base-os: |
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " systemd"
    DISTRO_FEATURES:remove = "initscripts"
    ## use journald instead of syslog
    VIRTUAL-RUNTIME_syslog = ""
    VIRTUAL-RUNTIME_base-utils-syslog = ""

  security: |
    DISTRO_FEATURES:append = " tpm2"
    DISTRO_FEATURES:append = " security"

  no-dhcp: |
    ## Using systemd-networkd doesn't require dhcpcd
    ## Don't install dhcpcd at all
    ## RDEPENDS:packagegroup-core-base-utils:remove = "dhcpcd"
    ## Or disable starting dhcpcd as daemon via systemd
    SYSTEMD_AUTO_ENABLE:dhcpcd = "disable"

  e41x: |
    RPI_USE_U_BOOT = "1"
